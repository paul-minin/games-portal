<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcade – 4 Spiele</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hud" aria-live="polite">
      <div class="hud__title" id="hudTitle">Arcade</div>
      <div class="hud__score">
        <span class="hud__label" id="scoreLabel">Score</span>: <span id="score">0</span>
        <span class="hud__sep">·</span>
        Best: <span id="best">0</span>
      </div>
    </header>

    <section class="game-picker" aria-label="Spiele auswählen">
      <div class="picker__intro">
        <div>
          <p class="picker__eyebrow">Spiele</p>
          <h2 class="picker__title">Scroll durch die Spiele</h2>
          <p class="picker__subtitle">Klicke auf ein Spiel, um direkt loszulegen.</p>
        </div>
      </div>

      <div class="picker__list" id="gameList" aria-label="Spieleauswahl">
        <button class="game-card" type="button" data-game="runner">
          <span class="card__icon">🏃</span>
          <strong>Runner</strong>
          <p>Sprint, springe über Hindernisse und halte den Highscore.</p>
        </button>
        <button class="game-card" type="button" data-game="snake">
          <span class="card__icon">🐍</span>
          <strong>Snake</strong>
          <p>Wachse, weiche dir selbst aus und besiege die Zeit.</p>
        </button>
        <button class="game-card" type="button" data-game="flappy">
          <span class="card__icon">🐦</span>
          <strong>Flappy</strong>
          <p>Tippe, halte die Fliege im Flug und meistere die Rohre.</p>
        </button>
        <button class="game-card" type="button" data-game="breakout">
          <span class="card__icon">🟦</span>
          <strong>Breakout</strong>
          <p>Zerstöre Blöcke mit Ball und Schläger.</p>
        </button>
      </div>
    </section>

    <section class="stage" aria-label="Spielbereich">
      <canvas id="game" width="900" height="420" aria-label="Arcade Spiel"></canvas>
      <div id="overlay" class="overlay" role="status">
        <h1 class="overlay__title" id="overlayTitle">Arcade</h1>
        <p class="overlay__text" id="overlayLine1">Wähle ein Spiel oben aus und klicke darauf.</p>
        <p class="overlay__text" id="overlayLine2">Escape = Menü</p>
        <div class="overlay__actions">
          <button id="primaryBtn" class="overlay__btn" type="button">Start</button>
        </div>
      </div>
    </section>

    <footer class="help">
      <span id="helpText">Scroll durch die Spiele und klicke auf eins zum Start.</span>
    </footer>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
